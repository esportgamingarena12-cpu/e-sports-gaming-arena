# Netlify settings for the web app (publish folder is relative to web/).
[build]
  command = "npm run build && node scripts/check-build-keys.mjs"
  publish = "dist/web/browser"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Single page app: every path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and its file list must never be cached, or updates would not reach installed apps
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
